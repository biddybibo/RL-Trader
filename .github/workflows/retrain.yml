name: Retrain adaptive agent

# Monthly, before the market opens on the 1st
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps
        default: "200000"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - name: Retrain
        run: python retrain.py --steps "${{ github.event.inputs.steps || '200000' }}"
      - name: Commit
        run: |
          git config user.name "rl-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/adaptive.pt models/adaptive_history.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Retrain adaptive agent ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
